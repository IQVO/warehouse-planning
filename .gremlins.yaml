# .gremlins.yaml — mutation-testing configuration template (warehouse-harness-template v2).
#
# gremlins (github.com/go-gremlins/gremlins, pinned to v0.6.0 in CI) reads
# this file automatically from the Go module root, so the `mutation-fast`
# CI job, the scheduled exhaustive `mutation` CI job, the `drift` job's
# coverage-quality check, and the local `make mutation` / `make
# mutation-full` targets all run with identical settings.
#
# Mutation testing is the sensor that tells us whether the tests actually
# ASSERT rather than merely execute. The thresholds below turn it into a
# blocking quality gate instead of a report.
silent: false

unleash:
  # A single worker with a generous timeout coefficient avoids spurious
  # TIMED OUT results on modules where mutants finish in tens of
  # milliseconds but parallel workers contend over the build cache.
  workers: 1
  timeout-coefficient: 30

  threshold:
    # gremlins fails when the measured value is <= the threshold
    # (internal/report/report.go in gremlins itself), so a threshold must
    # sit strictly BELOW the number this repo can meet today.
    #
    # Re-measured 2026-10-03 (Phase 2, local gremlins v0.6.0, matching
    # CI's pin) after adding WorkloadProfile, ComputeProcessPathCapacity
    # and ProcessPath to ./internal/domain/processcapacity: efficacy
    # 100.00% and mutant coverage 100.00% across 21 mutants (up from the
    # original 9 at Phase 1), all killed. The threshold value itself
    # (99) still holds -- not lowered, just re-confirmed against the
    # larger mutant set so a future reader knows this comment reflects
    # the package's current contents, not just Phase 1's.
    # 99 locks in today's quality and fails CI the moment a single mutant
    # survives, mirroring the 90% coverage gate's "just under what we
    # already achieve" approach -- never copied from a sibling repo.
    efficacy: 99
    mutant-coverage: 99
