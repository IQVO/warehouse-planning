{{- include "warehouse-planning.requireDatabase" . -}}
{{- include "warehouse-planning.requireKafkaForPublisher" . -}}
{{- include "warehouse-planning.requireDemandConfig" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warehouse-planning.fullname" . }}
  labels:
    {{- include "warehouse-planning.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "warehouse-planning.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "warehouse-planning.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "warehouse-planning.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: MIGRATIONS_PATH
              value: {{ .Values.config.migrationsPath | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: EVENT_PUBLISHER
              value: {{ .Values.config.eventPublisher | quote }}
            {{- with .Values.config.outboxRelayInterval }}
            - name: OUTBOX_RELAY_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.corsAllowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            # Consumer-group ids come from values, never literals: a stable id
            # is what makes a restarted/rescheduled pod resume from its
            # committed offsets instead of re-reading from the start.
            - name: LABOR_CAPACITY_CONSUMER_GROUP
              value: {{ .Values.config.laborCapacityConsumerGroup | quote }}
            - name: STORAGE_CAPACITY_CONSUMER_GROUP
              value: {{ .Values.config.storageCapacityConsumerGroup | quote }}
            {{- if .Values.demand.consumerGroup }}
            # Order-demand consumer (docs/adr/0004). Both come from the
            # dedicated `demand` values, never from extraEnv; they are absent
            # while demand.consumerGroup is empty, which keeps the feature OFF.
            - name: DEMAND_CONSUMER_GROUP
              value: {{ .Values.demand.consumerGroup | quote }}
            - name: DEMAND_SITE_ID
              value: {{ .Values.demand.siteId | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "warehouse-planning.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment:
            # a direct (non-pooled) connection used only for the
            # golang-migrate step in cmd/api/main.go, never for the runtime
            # pgxpool. `optional: true` so a secret without this key still
            # starts the pod -- the binary falls back to DATABASE_URL.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "warehouse-planning.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- if .Values.kafka.enabled }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
