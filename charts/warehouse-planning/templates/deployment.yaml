{{- include "warehouse-planning.requireRealRuntime" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warehouse-planning.fullname" . }}
  labels:
    {{- include "warehouse-planning.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "warehouse-planning.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "warehouse-planning.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "warehouse-planning.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # D14 (2026-10-12): every config.* value (OUTBOX_RELAY_INTERVAL,
          # OUTBOX_MAX_ATTEMPTS, SHUTDOWN_DRAIN_DELAY, CORS_ALLOWED_ORIGINS,
          # ...) reaches cmd/api through the chart ConfigMap. The explicit
          # `env` entries below win over envFrom for the same key and carry
          # the same values, so nothing changes for the variables already set
          # here; the checksum/config annotation above rolls the pods when the
          # ConfigMap changes. Only this Deployment mounts it: the other
          # binaries read their own explicit env (the reports binary would
          # otherwise bind the api's HTTP_ADDR).
          envFrom:
            - configMapRef:
                name: {{ include "warehouse-planning.fullname" . }}
          env:
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: MIGRATIONS_PATH
              value: {{ .Values.config.migrationsPath | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: EVENT_PUBLISHER
              value: {{ .Values.config.eventPublisher | quote }}
            {{- with .Values.config.outboxRelayInterval }}
            - name: OUTBOX_RELAY_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            # D12 / ADR 0013: the relay excludes a row after this many
            # failures (0 = unlimited).
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.config.outboxMaxAttempts | quote }}
            {{- with .Values.config.corsAllowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.shutdownDrainDelay }}
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ . | quote }}
            {{- end }}
            # D21 / ADR 0015: OTel resource attributes and the Collector.
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            # Consumer-group ids come from values, never literals: a stable id
            # is what makes a restarted/rescheduled pod resume from its
            # committed offsets instead of re-reading from the start.
            - name: LABOR_CAPACITY_CONSUMER_GROUP
              value: {{ .Values.config.laborCapacityConsumerGroup | quote }}
            - name: STORAGE_CAPACITY_CONSUMER_GROUP
              value: {{ .Values.config.storageCapacityConsumerGroup | quote }}
            # Order-demand consumer (docs/adr/0004): always on, both come from
            # the dedicated `demand` values, never from extraEnv.
            - name: DEMAND_CONSUMER_GROUP
              value: {{ .Values.demand.consumerGroup | quote }}
            - name: DEMAND_SITE_ID
              value: {{ .Values.demand.siteId | quote }}
            # Dock-appointment and task-completion consumers (docs/adr/0017):
            # always on, each group comes from its dedicated value.
            - name: INBOUND_DEMAND_CONSUMER_GROUP
              value: {{ .Values.inbound.consumerGroup | quote }}
            - name: OBSERVED_CAPACITY_CONSUMER_GROUP
              value: {{ .Values.observed.consumerGroup | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "warehouse-planning.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment:
            # a direct (non-pooled) connection used only for the
            # golang-migrate step in cmd/api/main.go, never for the runtime
            # pgxpool. `optional: true` so a secret without this key still
            # starts the pod -- the binary falls back to DATABASE_URL.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "warehouse-planning.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
