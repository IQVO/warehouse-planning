{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "warehouse-planning.frontendFullname" . }}
  labels:
    {{- include "warehouse-planning.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  # ClusterIP only, always. The Nginx web gateway in warehouse-infra is the
  # single host-exposed frontend endpoint; giving this Service a NodePort would
  # create a second, unpoliced way into the SPA.
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "warehouse-planning.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}
