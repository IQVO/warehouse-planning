# Used by `ct lint` (chart-testing): the chart refuses to render without the
# real runtime's mandatory values (ADR 0016): a database source, the Kafka
# brokers, every consumer group and the demand site. Dummy DSN, no password;
# nothing here is ever dialled.
database:
  url: "postgres://u@example.invalid:5432/db"
kafka:
  brokers: "kafka.example.invalid:9092"
config:
  laborCapacityConsumerGroup: "warehouse-planning-labor-capacity"
  storageCapacityConsumerGroup: "warehouse-planning-storage-capacity"
demand:
  consumerGroup: "warehouse-planning-demand"
  siteId: "SIM1"
inbound:
  consumerGroup: "warehouse-planning-inbound-demand"
observed:
  consumerGroup: "warehouse-planning-observed-capacity"
