# Default values for warehouse-planning.

replicaCount: 1

# The image is NEVER pulled from a registry in the local kind cluster: it is
# built from the local checkout and side-loaded with `kind load docker-image`
# (warehouse-infra overrides repository and tag with a content-derived
# local-<hash> tag). `pullPolicy: IfNotPresent` is required there, or the
# kubelet tries to pull from Docker Hub and ImagePullBackOffs.
image:
  repository: warehouse/warehouse-planning
  pullPolicy: IfNotPresent
  tag: "local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: warehouse-planning.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress: block above.
# Same shape as every other chart in this fleet (see workforce-management's
# charts/workforce-management/templates/httproute.yaml). Routes only to this
# chart's main REST API Service -- the same Service ingress.yaml targets.
# warehouse-infra turns it on and supplies the Kong Gateway parentRef + path.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) for the OLTP Deployment, disabled by
# default so nothing changes replica behaviour silently. When enabled, the
# Deployment's replicaCount is omitted so the HPA is the sole owner of
# .spec.replicas. N>1 is safe for the outbox relay (FOR UPDATE SKIP LOCKED) and
# the two Kafka consumers (stable consumer groups, atomic UnitOfWork claims);
# it has not been load-tested. mcp deliberately has no block here: the MCP
# Streamable-HTTP handler keeps per-process session state (see mcp: below).
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # frontend (web/, nginx-unprivileged serving the built SPA bundle): pure
  # static-asset serving, no server-side session or per-request state -- the
  # most trivially horizontally scalable workload in this chart. Only has an
  # effect when frontend.enabled is also true.
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # planning-projector (analytics): a fixed, stable consumer group
  # (analytics.projector.consumerGroup) lets N replicas share the topic's
  # partitions, and every write is idempotent on the CloudEvents id in the same
  # transaction, so correctness does not regress at N>1. Capped at 2: a
  # lightweight upsert workload. Only has an effect when analytics.enabled.
  projector:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  # planning-reports (analytics): stateless read-only reader over its own
  # read-only pool. Only has an effect when analytics.enabled.
  reports:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api/main.go. Every key maps 1:1 to one env var.
config:
  httpAddr: ":8080"                  # HTTP_ADDR
  # Relative to the image WORKDIR (/app): the Dockerfile copies
  # internal/adapters/outbound/postgres/migrations to /app/migrations.
  migrationsPath: "migrations"       # MIGRATIONS_PATH
  logLevel: "info"                   # LOG_LEVEL: debug | info | warn | error
  # CORS_ALLOWED_ORIGINS (comma-separated). Empty = not rendered, so the
  # binary's own local-dev default applies. In the kind cluster Kong's global
  # CORS plugin handles browsers; set this only for a direct-to-pod caller.
  corsAllowedOrigins: ""
  # EVENT_PUBLISHER: "log" (default; the outbox drains to the log sink) or
  # "kafka" (relay CapacityPlan events onto warehouse.warehouse-planning.events;
  # requires kafka.enabled=true -- the chart refuses to render otherwise).
  eventPublisher: "log"
  # OUTBOX_RELAY_INTERVAL: Go duration ("500ms", "2s") or plain seconds.
  # Empty = not rendered; the binary defaults to 1s.
  outboxRelayInterval: ""
  # Consumer-group ids of the two inbound Kafka consumers. Env-driven, never
  # literals in the template: a STABLE id lets a rescheduled pod resume from
  # its committed offsets. The values below equal the binary's own defaults.
  # LABOR_CAPACITY_CONSUMER_GROUP (reads warehouse.workforce.events)
  laborCapacityConsumerGroup: "warehouse-planning-labor-capacity"
  # STORAGE_CAPACITY_CONSUMER_GROUP (reads warehouse.facility.events)
  storageCapacityConsumerGroup: "warehouse-planning-storage-capacity"

# Order-demand consumer (docs/adr/0004): order-management's OrderAllocated /
# OrderPartiallyAllocated events (warehouse.order-management.events) into the
# local expected-demand read model. OFF by default and entirely absent from the
# rendered manifest while consumerGroup is empty, so a default render is
# byte-identical to a chart without this block.
demand:
  # DEMAND_CONSUMER_GROUP: the Kafka consumer group id. Empty = the feature is
  # OFF (no consumer is started; GET /demand still answers, from an empty
  # model). Use a STABLE id so a rescheduled pod resumes from its committed
  # offsets. Requires kafka.enabled=true and siteId (the chart refuses to
  # render otherwise).
  consumerGroup: ""
  # DEMAND_SITE_ID: order-management's orders carry no fulfillment site, so ALL
  # consumed demand is attributed to this ONE site code (e.g. SIM1) -- the same
  # `location` the labor and facility data use.
  siteId: ""

# The chart refuses to render unless database.url or database.existingSecret
# is set (templates/_helpers.tpl: warehouse-planning.requireDatabase).
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup step
  # (cmd/api/main.go) -- never for the runtime pgxpool, which always uses
  # existingSecretKey/DATABASE_URL. golang-migrate takes a session-scoped
  # pg_advisory_lock that PgBouncer's transaction pooling cannot honour.
  # `optional: true` on the rendered secretKeyRef so a secret without this key
  # still starts the pod: the binary falls back to DATABASE_URL.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# KAFKA_BROKERS is only set in the container env when kafka.enabled is true.
# Without it the two capacity consumers are DISABLED (logged, not fatal) and
# EVENT_PUBLISHER must stay "log". Consumed topics: warehouse.workforce.events
# (labor capacity) and warehouse.facility.events (storage/station capacity);
# produced topic: warehouse.warehouse-planning.events.
kafka:
  enabled: false
  brokers: "kafka:9092"

# Extra env vars appended to the OLTP container as a raw list.
extraEnv: []

# The Postgres dial (migrations + ping) at boot is wrapped in a bounded retry
# (~31s). periodSeconds * failureThreshold gives a ~60s window, comfortably
# past that, before the kubelet gives up. Once startupProbe succeeds,
# liveness/readiness take over. The service exposes /healthz only (there is no
# /readyz), so readiness reuses it.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's graceful shutdown (10s HTTP drain + 10s consumer drain).
terminationGracePeriodSeconds: 30

# --- MCP server ---
# The Model Context Protocol server (cmd/mcp, Streamable HTTP only). DISABLED
# by default. Enabling it renders its own Deployment + Service (component=mcp)
# over the same OLTP database, served at "/" and "/mcp" with GET /healthz
# probes, command /app/mcp. Env names in templates/mcp-deployment.yaml match
# cmd/mcp/main.go. It starts no outbox relay and dials no Kafka (the relay
# runs in the api component). No auth / API key: MCP servers are
# unauthenticated fleet-wide.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# --- frontend (Module Federation REMOTE `capacity_mfe`) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod (component=frontend). In the kind cluster it is
# reached through warehouse-infra's Nginx web gateway at
# http://localhost/mfes/warehouse-planning/ -- never through Kong, which serves
# APIs only and must never handle HTML, JavaScript, CSS, fonts or images. The
# remote reads its API origin at runtime from the console's /config.json
# (`${apiOrigin}/api/warehouse-planning`), so nothing about it is configured
# here.
#
# Deliberately NO ingress/httproute/gatewayApi block for it: frontend path
# routing is owned entirely by the Nginx web gateway, and the Service stays
# ClusterIP so this is not a second host-facing entrypoint.
#
# Disabled by default so existing releases are unaffected; warehouse-infra sets
# frontend.enabled=true and supplies the locally built image tag. The image is
# built from web/Dockerfile (see web/ and .claude/rules/frontend.md) and is
# NEVER pulled in kind: it is side-loaded, so keep pullPolicy IfNotPresent.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/warehouse-planning-frontend
    pullPolicy: IfNotPresent
    # Empty = the chart's appVersion. warehouse-infra overrides it with a
    # content-derived local-<hash> tag.
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- analytics read side (docs/adr/0005) ---
# A projector (the ONLY writer of the analytical database; consumes
# warehouse.warehouse-planning.analytics) and a read-only reports reader, backed
# by a SEPARATE analytical database (warehouse_planning_analytics). Each is its
# own Deployment (components analytics-projector / analytics-reports; the
# reports one also gets a ClusterIP Service). DISABLED by default and entirely
# absent from the rendered manifest, so a default render is byte-identical to a
# chart without this block. Events only reach the analytics topic while
# config.eventPublisher is "kafka" (and the projector needs kafka.enabled=true:
# the chart refuses to render otherwise, as it does without a DSN source).
analytics:
  enabled: false
  # Directory (inside the image, relative to WORKDIR /app) of the analytical
  # *.up.sql migrations the projector applies on start.
  migrationsPath: "analytics/migrations"
  database:
    # The projector's read-write analytical DSN (DIRECT Postgres, not
    # PgBouncer: it also runs the migrations). No password in committed values.
    projectorUrl: ""
    # The reports reader's DSN -- a read-only role where possible; falls back
    # to projectorUrl when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret holding ANALYTICS_DATABASE_URL (projector) and
    # ANALYTICS_READER_DATABASE_URL (reports). Takes precedence over the URLs.
    existingSecret: ""
  projector:
    replicaCount: 1
    adminAddr: ":8091"                  # ADMIN_ADDR (/healthz, /readyz)
    # ANALYTICS_CONSUMER_GROUP: the projector's FIXED consumer group. A stable
    # id lets a rescheduled pod resume from its committed offsets; a brand-new
    # group starts at the earliest offset and rebuilds the model from history.
    consumerGroup: "warehouse-planning-analytics"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    httpAddr: ":8092"                   # HTTP_ADDR
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# Deliberately NOT here: external routing to the reports Service (this chart
# routes only the main REST API; warehouse-infra owns edge routing) and any
# metrics endpoint (the analytics processes expose none).
