asyncapi: 2.6.0

info:
  title: warehouse-planning Domain Events
  version: "0.5.0"
  contact:
    name: warehouse-planning maintainers
    url: https://github.com/IQVO/warehouse-planning
    email: warehouse-planning@iqvo.example.com
  license:
    name: UNLICENSED
  description: |
    Event catalog for the **warehouse-planning** bounded context (WES
    subdomain): *can this warehouse process the demand assigned to it?*

    **Published (Phase 4).** The `CapacityPlan` aggregate raises four events,
    published to `warehouse.warehouse-planning.events` through a
    **transactional outbox**: the plan and its already-encoded events are
    written in ONE database transaction, and a relay drains them to Kafka
    (at-least-once; the CloudEvents `id` is persisted with the outbox row, so
    a retry republishes the same `id` -- consumers dedupe on it). Per plan:
    `CapacityPlanCreated` on creation; on publication
    `CapacityPlanPublished`, plus `CapacityShortageDetected` and
    `BottleneckDetected` only when the plan has a shortage.
    `ProcessCapacityRegistered`/`ProcessCapacityChanged` are NOT published yet.

    **Consumed (Phase 3).** `ShiftPlanCommitted` (workforce-management) and
    `LocationSlotRegistered`/`LocationSlotDecommissioned` (facility-layout) keep
    local ProcessCapacity read models current; this context never makes a
    live cross-context call.

    **Consumed (ADR 0004, opt-in).** `OrderAllocated` and
    `OrderPartiallyAllocated` (order-management, topic
    `warehouse.order-management.events`) keep a local expected-demand read
    model current when `DEMAND_CONSUMER_GROUP` is set (unset = no consumer).
    Each order is counted once, at its latest promise cutoff, and attributed to
    the ONE configured site (`DEMAND_SITE_ID`): order-management's events carry
    no fulfillment site. `OrderRepromised` and every other type are ignored.

    **Analytics stream (ADR 0005).** The same four events are ALSO written to
    `warehouse.warehouse-planning.analytics` in the SAME outbox transaction
    (two outbox rows per event, one per topic), as CloudEvents 1.0 with the
    SAME `type` and the SAME `id` per occurrence but
    `dataschema=urn:warehouse:warehouse-planning:analytics:<EventName>:v1`.
    The integration messages are byte-identical to what they were before the
    stream existed. The analytics payloads are the integration payloads plus
    additive, analytics-only fields: today `binding_constraint` on
    `CapacityPlanPublished` (the constraint type -- LABOR, STATION, ... --
    binding the bottleneck step; `""` for a plan created before it was
    recorded). Only this service's own `planning-projector` consumes it (fixed
    consumer group, at-least-once, offsets committed after the projection
    committed), into a SEPARATE analytical database that
    `planning-reports` serves read-only. Poison messages go to
    `warehouse.warehouse-planning.analytics.dlq`.

    **Envelope (mandatory).** Every message is a CloudEvents 1.0 event in
    *structured content mode* (Kafka value = JSON event format) with the Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`. All of
    `specversion` (`1.0`), `id`, `source` (`/warehouse/warehouse-planning`),
    `type`, `subject`, `time`, `datacontenttype` (`application/json`) and
    `dataschema` are required; the payload sits under `data`. No flat
    envelope, no toggle.

    **Type naming.** `com.warehouse.wes.warehouse-planning.<entity>.<EventName>`
    where `<entity>` is the aggregate that raised the event, lowercase, no
    separators -- here `capacityplan`. **dataschema** =
    `urn:warehouse:warehouse-planning:events:<EventName>:v1`. **subject** and
    the Kafka message key = the capacity plan id (one plan's events stay
    ordered on one partition). A breaking payload change gets a new `.v2`
    type and dataschema, never a mutation.

servers:
  production:
    url: "{brokers}"
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: "kafka.warehouse-systems.internal:9092"

defaultContentType: application/cloudevents+json

tags:
  - name: warehouse-planning
    description: The warehouse-planning bounded context (WES subdomain).
  - name: capacity-plan
    description: Events raised by the CapacityPlan aggregate (published, Phase 4).
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (Phase 3).
  - name: analytics
    description: "The analytics stream (ADR 0005): the same capacity-plan events on this service's own analytics topic, consumed only by planning-projector."

channels:
  warehouse.warehouse-planning.events:
    description: |
      This service's integration topic (`Topic` in
      `internal/adapters/outbound/kafka/encoder.go`). Written by the outbox
      relay; key = capacity plan id; every message carries the
      `content-type: application/cloudevents+json; charset=UTF-8` header.
      Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    subscribe:
      operationId: receiveCapacityPlanEvents
      summary: Receive CapacityPlan events.
      description: |
        Subscribe to the CapacityPlan event stream. Route on the full `type`
        (`com.warehouse.wes.warehouse-planning.capacityplan.<EventName>`).
      tags:
        - name: capacity-plan
      message:
        oneOf:
          - $ref: "#/components/messages/CapacityPlanCreated"
          - $ref: "#/components/messages/CapacityPlanPublished"
          - $ref: "#/components/messages/CapacityShortageDetected"
          - $ref: "#/components/messages/BottleneckDetected"

  warehouse.warehouse-planning.analytics:
    description: |
      This service's analytics topic (`AnalyticsTopic` in
      `internal/adapters/outbound/kafka/analytics_encoder.go`; ADR 0005). Written by
      the SAME outbox relay, from rows inserted in the same transaction as the
      integration rows; key = capacity plan id. Consumed ONLY by this service's
      `planning-projector` under a fixed consumer group read from env
      `ANALYTICS_CONSUMER_GROUP` (at-least-once; the offset is committed after the
      projection and the dedupe mark committed together in the analytical database).
      The projector dedupes on `id`, ignores unknown types, skips (with a rate-limited
      WARN) anything that is not CloudEvents 1.0, and dead-letters a known type with an
      unusable payload to `warehouse.warehouse-planning.analytics.dlq` (raw bytes plus
      `x-dlq-*` headers). Not an integration contract: other contexts consume the
      integration topic.
    subscribe:
      operationId: receiveCapacityPlanAnalyticsEvents
      summary: Receive the CapacityPlan analytics events.
      description: |
        Route on the full `type`; the payloads are the integration payloads plus
        the additive analytics-only fields documented per message.
      tags:
        - name: analytics
      message:
        oneOf:
          - $ref: "#/components/messages/CapacityPlanCreatedAnalytics"
          - $ref: "#/components/messages/CapacityPlanPublishedAnalytics"
          - $ref: "#/components/messages/CapacityShortageDetectedAnalytics"
          - $ref: "#/components/messages/BottleneckDetectedAnalytics"

  warehouse.workforce.events:
    description: |
      workforce-management's integration topic (`LaborTopic`). This service
      consumes it with its own consumer group (env `LABOR_CAPACITY_CONSUMER_GROUP`).
    publish:
      operationId: consumeShiftPlanCommitted
      summary: Consume workforce-management's ShiftPlanCommitted.
      description: |
        Consumed by this service: one message per PathPlan line becomes a
        LABOR capacity constraint. Offsets are committed only after the
        effect and its idempotency claim committed atomically.
      tags:
        - name: consumed
      message:
        $ref: "#/components/messages/ShiftPlanCommitted"

  warehouse.facility.events:
    description: |
      facility-layout's integration topic (`FacilityTopic`). This service
      consumes it with its own consumer group (env `STORAGE_CAPACITY_CONSUMER_GROUP`).
    publish:
      operationId: consumeLocationSlotEvents
      summary: Consume facility-layout's location slot events.
      description: |
        Consumed by this service: storage positions (per zone + locationType) and
        work-center stations (per zone + activity) are tallied. The consumer only
        maintains that tally -- it registers no ProcessCapacity constraint.
        Station counts are composed with labor and the operator-declared station
        standard at read time, and positions are a read model
        (`GET /storage-capacity`); see docs/adr/0002-station-capacity-composition.md.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/LocationSlotRegistered"
          - $ref: "#/components/messages/LocationSlotDecommissioned"

  warehouse.order-management.events:
    description: |
      order-management's integration topic (`OrderTopic`). This service consumes
      it with a STABLE consumer group read from env `DEMAND_CONSUMER_GROUP` (no
      default; unset means the consumer is not started). Only
      `OrderAllocated` and `OrderPartiallyAllocated` are acted on; every other
      CloudEvents `type` -- `OrderRepromised` included -- is ignored, and a
      message that is not a valid CloudEvent is skipped (WARN), never blocking
      the partition.
    publish:
      operationId: consumeOrderAllocationEvents
      summary: Consume order-management's order allocation events.
      description: |
        Consumed by this service into a LOCAL expected-demand read model
        (`order_demand`, one row per order id; `GET /demand`,
        `get_expected_demand`, and the default of `POST /capacity-plans`
        `assigned_demand`). An order is demand in a window [start, end) when its
        `promise_date` (the promise cutoff) is at or after start and strictly
        before end. Last writer wins per order id on the CloudEvents `time`
        (a later or equal time replaces, an older one is a no-op). The
        idempotency claim on the CloudEvents `id` and the upsert commit in ONE
        database transaction; the offset is committed only afterwards. order-
        management's events carry no site, no quantities and no cancellations
        (OrderCancelled is analytics-topic only), so demand is counted in
        ORDERS, attributed to the one configured site, and not netted; see
        docs/adr/0004-demand-ingestion-from-order-management.md.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/OrderAllocated"
          - $ref: "#/components/messages/OrderPartiallyAllocated"

components:
  messages:
    CapacityPlanCreated:
      name: CapacityPlanCreated
      title: Capacity plan created
      summary: A DRAFT CapacityPlan was created with its computed shortage.
      description: |
        Raised by the `CapacityPlan` aggregate on `POST /capacity-plans` and queued
        in the transactional outbox in the same transaction as the plan. `type` =
        `com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanCreated`, `subject` and Kafka key = the plan id.
      contentType: application/cloudevents+json
      tags:
        - name: capacity-plan
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/CapacityPlanCreatedEvent"
      examples:
        - name: draftPlanWithShortage
          summary: "A plan for 12000 orders over 8h on Pick -> Rebin -> Pack (1000 ORDER/h): short by 4000."
          payload:
            specversion: "1.0"
            id: "6f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e33"
            source: "/warehouse/warehouse-planning"
            type: "com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanCreated"
            subject: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
            time: "2026-10-04T21:15:30Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:warehouse-planning:events:CapacityPlanCreated:v1"
            data:
              plan_id: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
              warehouse_id: "WH-1"
              location: "PATH-ZONE-A"
              path_id: "pick-rebin-pack"
              window_start: "2026-10-05T08:00:00Z"
              window_end: "2026-10-05T16:00:00Z"
              assigned_demand: 12000
              path_capacity: 1000
              capacity_over_window: 8000
              shortage: 4000
              bottleneck_step: "REBIN"
              status: "DRAFT"

    CapacityPlanPublished:
      name: CapacityPlanPublished
      title: Capacity plan published
      summary: A DRAFT CapacityPlan was published.
      description: |
        Raised by `CapacityPlan.Publish` on `POST /capacity-plans/{id}/publish`.
        Always accompanied by `CapacityShortageDetected` and `BottleneckDetected`
        when the plan has a shortage. A plan is published at most once. `type` =
        `com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanPublished`.
      contentType: application/cloudevents+json
      tags:
        - name: capacity-plan
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/CapacityPlanPublishedEvent"
      examples:
        - name: publishedPlan
          summary: The section-43 plan, published.
          payload:
            specversion: "1.0"
            id: "9a8d7c6b-5e4f-4a3b-8c2d-1e0f9a8b7c6d"
            source: "/warehouse/warehouse-planning"
            type: "com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanPublished"
            subject: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
            time: "2026-10-04T21:45:10Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:warehouse-planning:events:CapacityPlanPublished:v1"
            data:
              plan_id: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
              warehouse_id: "WH-1"
              location: "PATH-ZONE-A"
              path_id: "pick-rebin-pack"
              window_start: "2026-10-05T08:00:00Z"
              window_end: "2026-10-05T16:00:00Z"
              assigned_demand: 12000
              path_capacity: 1000
              capacity_over_window: 8000
              shortage: 4000
              bottleneck_step: "REBIN"
              published_at: "2026-10-04T21:45:10Z"

    CapacityShortageDetected:
      name: CapacityShortageDetected
      title: Capacity shortage detected
      summary: Published demand exceeds the path capacity over the window.
      description: |
        Raised at publish time, ONLY when `shortage > 0` (demand exactly equal to
        the capacity over the window is not a shortage). `type` =
        `com.warehouse.wes.warehouse-planning.capacityplan.CapacityShortageDetected`.
      contentType: application/cloudevents+json
      tags:
        - name: capacity-plan
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/CapacityShortageDetectedEvent"
      examples:
        - name: shortageOf4000
          summary: "12000 orders assigned, 8000 orders of capacity: short by 4000, bound by REBIN."
          payload:
            specversion: "1.0"
            id: "3b2a1c0d-9e8f-4d7c-b6a5-4f3e2d1c0b9a"
            source: "/warehouse/warehouse-planning"
            type: "com.warehouse.wes.warehouse-planning.capacityplan.CapacityShortageDetected"
            subject: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
            time: "2026-10-04T21:45:10Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:warehouse-planning:events:CapacityShortageDetected:v1"
            data:
              plan_id: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
              warehouse_id: "WH-1"
              location: "PATH-ZONE-A"
              path_id: "pick-rebin-pack"
              window_start: "2026-10-05T08:00:00Z"
              window_end: "2026-10-05T16:00:00Z"
              assigned_demand: 12000
              capacity_over_window: 8000
              shortage: 4000
              bottleneck_step: "REBIN"

    BottleneckDetected:
      name: BottleneckDetected
      title: Bottleneck detected
      summary: Names the path step limiting end-to-end flow of a plan with a shortage.
      description: |
        Raised at publish time together with `CapacityShortageDetected`, ONLY when
        the plan has a shortage. `type` = `com.warehouse.wes.warehouse-planning.capacityplan.BottleneckDetected`.
      contentType: application/cloudevents+json
      tags:
        - name: capacity-plan
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/BottleneckDetectedEvent"
      examples:
        - name: rebinBottleneck
          summary: REBIN limits the Pick -> Rebin -> Pack path to 1000 ORDER/h.
          payload:
            specversion: "1.0"
            id: "7e6d5c4b-3a29-4180-9f7e-6d5c4b3a2918"
            source: "/warehouse/warehouse-planning"
            type: "com.warehouse.wes.warehouse-planning.capacityplan.BottleneckDetected"
            subject: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
            time: "2026-10-04T21:45:10Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:warehouse-planning:events:BottleneckDetected:v1"
            data:
              plan_id: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
              warehouse_id: "WH-1"
              location: "PATH-ZONE-A"
              path_id: "pick-rebin-pack"
              window_start: "2026-10-05T08:00:00Z"
              window_end: "2026-10-05T16:00:00Z"
              bottleneck_step: "REBIN"
              path_capacity: 1000

    CapacityPlanCreatedAnalytics:
      name: CapacityPlanCreatedAnalytics
      title: Capacity plan created (analytics stream)
      summary: The analytics copy of CapacityPlanCreated.
      description: |
        Same `type`, same `id`, same payload as the integration CapacityPlanCreated;
        only `dataschema` differs (`urn:warehouse:warehouse-planning:analytics:CapacityPlanCreated:v1`).
        The projector uses the CloudEvents `time` as the plan's creation instant.
      contentType: application/cloudevents+json
      tags:
        - name: analytics
      payload:
        $ref: "#/components/schemas/CapacityPlanCreatedAnalyticsEvent"
      examples:
        - name: draftPlanWithShortage
          summary: Same example as the integration message, analytics dataschema.
          payload:
            specversion: "1.0"
            id: "6f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e33"
            source: "/warehouse/warehouse-planning"
            type: "com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanCreated"
            subject: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
            time: "2026-10-04T21:15:30Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:warehouse-planning:analytics:CapacityPlanCreated:v1"
            data:
              plan_id: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
              warehouse_id: "WH-1"
              location: "PATH-ZONE-A"
              path_id: "pick-rebin-pack"
              window_start: "2026-10-05T08:00:00Z"
              window_end: "2026-10-05T16:00:00Z"
              assigned_demand: 12000
              path_capacity: 1000
              capacity_over_window: 8000
              shortage: 4000
              bottleneck_step: "REBIN"
              status: "DRAFT"

    CapacityPlanPublishedAnalytics:
      name: CapacityPlanPublishedAnalytics
      title: Capacity plan published (analytics stream)
      summary: The analytics copy of CapacityPlanPublished, plus binding_constraint.
      description: |
        Same `type` and `id` as the integration CapacityPlanPublished; the payload adds
        `binding_constraint` (additive, analytics-only): the constraint type binding the
        bottleneck step, which the bottleneck-frequency report groups by. The projector
        uses the CloudEvents `time` as the plan's publication instant.
      contentType: application/cloudevents+json
      tags:
        - name: analytics
      payload:
        $ref: "#/components/schemas/CapacityPlanPublishedAnalyticsEvent"
      examples:
        - name: publishedPlan
          summary: The published plan, bound by STATION at REBIN.
          payload:
            specversion: "1.0"
            id: "9a8d7c6b-5e4f-4a3b-8c2d-1e0f9a8b7c6d"
            source: "/warehouse/warehouse-planning"
            type: "com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanPublished"
            subject: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
            time: "2026-10-04T21:45:10Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:warehouse-planning:analytics:CapacityPlanPublished:v1"
            data:
              plan_id: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
              warehouse_id: "WH-1"
              location: "PATH-ZONE-A"
              path_id: "pick-rebin-pack"
              window_start: "2026-10-05T08:00:00Z"
              window_end: "2026-10-05T16:00:00Z"
              assigned_demand: 12000
              path_capacity: 1000
              capacity_over_window: 8000
              shortage: 4000
              bottleneck_step: "REBIN"
              published_at: "2026-10-04T21:45:10Z"
              binding_constraint: "STATION"

    CapacityShortageDetectedAnalytics:
      name: CapacityShortageDetectedAnalytics
      title: Capacity shortage detected (analytics stream)
      summary: The analytics copy of CapacityShortageDetected.
      description: |
        Same `type`, `id` and payload as the integration CapacityShortageDetected; only
        `dataschema` differs.
      contentType: application/cloudevents+json
      tags:
        - name: analytics
      payload:
        $ref: "#/components/schemas/CapacityShortageDetectedAnalyticsEvent"
      examples:
        - name: shortageOf4000
          summary: Short by 4000, bound by REBIN.
          payload:
            specversion: "1.0"
            id: "3b2a1c0d-9e8f-4d7c-b6a5-4f3e2d1c0b9a"
            source: "/warehouse/warehouse-planning"
            type: "com.warehouse.wes.warehouse-planning.capacityplan.CapacityShortageDetected"
            subject: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
            time: "2026-10-04T21:45:10Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:warehouse-planning:analytics:CapacityShortageDetected:v1"
            data:
              plan_id: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
              warehouse_id: "WH-1"
              location: "PATH-ZONE-A"
              path_id: "pick-rebin-pack"
              window_start: "2026-10-05T08:00:00Z"
              window_end: "2026-10-05T16:00:00Z"
              assigned_demand: 12000
              capacity_over_window: 8000
              shortage: 4000
              bottleneck_step: "REBIN"

    BottleneckDetectedAnalytics:
      name: BottleneckDetectedAnalytics
      title: Bottleneck detected (analytics stream)
      summary: The analytics copy of BottleneckDetected.
      description: |
        Same `type`, `id` and payload as the integration BottleneckDetected; only
        `dataschema` differs.
      contentType: application/cloudevents+json
      tags:
        - name: analytics
      payload:
        $ref: "#/components/schemas/BottleneckDetectedAnalyticsEvent"
      examples:
        - name: rebinBottleneck
          summary: REBIN limits the path to 1000 ORDER/h.
          payload:
            specversion: "1.0"
            id: "7e6d5c4b-3a29-4180-9f7e-6d5c4b3a2918"
            source: "/warehouse/warehouse-planning"
            type: "com.warehouse.wes.warehouse-planning.capacityplan.BottleneckDetected"
            subject: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
            time: "2026-10-04T21:45:10Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:warehouse-planning:analytics:BottleneckDetected:v1"
            data:
              plan_id: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
              warehouse_id: "WH-1"
              location: "PATH-ZONE-A"
              path_id: "pick-rebin-pack"
              window_start: "2026-10-05T08:00:00Z"
              window_end: "2026-10-05T16:00:00Z"
              bottleneck_step: "REBIN"
              path_capacity: 1000

    ShiftPlanCommitted:
      name: ShiftPlanCommitted
      title: Shift plan committed (consumed)
      summary: workforce-management committed a headcount split for a path.
      description: |
        CONSUMED from `warehouse.workforce.events` (producer: workforce-management;
        one message per PathPlan line). Becomes a LABOR `CapacityConstraint` on the
        ProcessCapacity of ProcessType = upper-case(`path_id`), location =
        `building_id`: rate = `planned_heads * planned_rate` (UNIT/HOUR), window =
        `[time, time + planned_hours)`. Deduped on the CloudEvents `id`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/ShiftPlanCommittedEvent"
      examples:
        - name: packLine
          summary: One fanned-out line of a plan committed for building BLD1.
          payload:
            specversion: "1.0"
            id: "9f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e33"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.shiftplan.ShiftPlanCommitted"
            subject: "BLD1/SHIFT1"
            time: "2026-10-04T22:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:events:ShiftPlanCommitted:v1"
            data:
              building_id: "BLD1"
              shift_id: "SHIFT1"
              path_id: "pack"
              planned_heads: 3
              planned_rate: 50
              planned_hours: 8

    OrderAllocated:
      name: OrderAllocated
      title: Order allocated (consumed)
      summary: order-management allocated every line of an order and released the eligible ones.
      description: |
        CONSUMED from `warehouse.order-management.events` (producer: order-management,
        its own `apis/asyncapi.yaml`). Upserts the order into the expected-demand read
        model: promise cutoff = `data.promise_date`, released lines = `len(data.lines)`,
        site = the configured `DEMAND_SITE_ID` (the event carries none). `subject` must
        equal `data.order_id`. Deduped on the CloudEvents `id`; last writer wins per
        order on `time`. `type` =
        `com.warehouse.wes.order-management.order.OrderAllocated`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/OrderAllocatedEvent"
      examples:
        - name: twoLineOrder
          summary: A two-line order promised for 2026-10-05T10:00Z.
          payload:
            specversion: "1.0"
            id: "4f1c2a7e-9d31-4a6b-8f0e-6b2c1d5e7a90"
            source: "/warehouse/order-management"
            type: "com.warehouse.wes.order-management.order.OrderAllocated"
            subject: "ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2"
            time: "2026-10-04T09:15:30Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:order-management:events:OrderAllocated:v1"
            data:
              order_id: "ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2"
              promise_date: "2026-10-05T10:00:00Z"
              lines:
                - line_no: 1
                  sku: "SKU-BOOK-0001"
                  path_id: "pick"
                  gift_wrap: false
                  fulfillment_class: "SAME_SKU_MULTI"
                - line_no: 2
                  sku: "SKU-BOOK-0002"
                  path_id: "pick"
                  gift_wrap: true
                  fulfillment_class: "SAME_SKU_MULTI"

    OrderPartiallyAllocated:
      name: OrderPartiallyAllocated
      title: Order partially allocated (consumed)
      summary: Some lines of a partial-shipment order were allocated and released, some backordered.
      description: |
        CONSUMED from `warehouse.order-management.events`. Same payload shape and the
        same effect as OrderAllocated (`data.lines` carries exactly the lines released
        in that pass); a later OrderAllocated for the same order replaces it. `type` =
        `com.warehouse.wes.order-management.order.OrderPartiallyAllocated`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/OrderPartiallyAllocatedEvent"

    LocationSlotRegistered:
      name: LocationSlotRegistered
      title: Location slot registered (consumed)
      summary: facility-layout registered a storage position or a work center.
      description: |
        CONSUMED from `warehouse.facility.events` (producer: facility-layout). Tallied
        per (zoneId, locationType) as storage positions (role Storage), or per
        zone + activity as stations (role WorkCenter). A zone belongs to the site
        (planning location) named by its zone id's first dash-separated segment.
        Deduped on the CloudEvents `id`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/LocationSlotRegisteredEvent"
      examples:
        - name: storageSlot
          summary: A bulk storage position registered in ZONE-A.
          payload:
            specversion: "1.0"
            id: "5c4b3a29-1807-4f6e-8d5c-4b3a29180716"
            source: "/warehouse/facility-layout"
            type: "com.warehouse.wms.facility-layout.locationslot.LocationSlotRegistered"
            subject: "A-01-01"
            time: "2026-10-04T20:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:facility-layout:events:LocationSlotRegistered:v1"
            data:
              locationCode: "A-01-01"
              zoneId: "ZONE-A"
              locationType: "BULK"
              role: "Storage"

    LocationSlotDecommissioned:
      name: LocationSlotDecommissioned
      title: Location slot decommissioned (consumed)
      summary: facility-layout decommissioned a position.
      description: |
        CONSUMED from `warehouse.facility.events` (producer: facility-layout).
        Decrements the tally the matching LocationSlotRegistered incremented; an
        untracked `locationCode` is logged and ignored.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/LocationSlotDecommissionedEvent"
      examples:
        - name: slotRemoved
          summary: Position A-01-01 decommissioned.
          payload:
            specversion: "1.0"
            id: "2d1c0b9a-8776-4554-a332-1d0c9b8a7665"
            source: "/warehouse/facility-layout"
            type: "com.warehouse.wms.facility-layout.locationslot.LocationSlotDecommissioned"
            subject: "A-01-01"
            time: "2026-10-04T23:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:facility-layout:events:LocationSlotDecommissioned:v1"
            data:
              locationCode: "A-01-01"

  schemas:
    CloudEventEnvelope:
      type: object
      description: >
        CloudEvents 1.0 structured-mode envelope. Every attribute below is
        required; the context's own payload sits under data.
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          description: UUID v4, minted once per domain event and persisted with the outbox row, so a redelivery repeats it. Dedupe on it.
        source:
          type: string
          example: "/warehouse/warehouse-planning"
        type:
          type: string
          description: Full reverse-DNS type; dispatch on the whole string.
        subject:
          type: string
          description: Aggregate instance id (never empty).
        time:
          type: string
          format: date-time
          description: Domain occurred-at, UTC.
        datacontenttype:
          type: string
          const: "application/json"
        dataschema:
          type: string
          description: urn:warehouse:<repo>:events:<EventName>:v<N>.
        data:
          type: object
    CapacityPlanCreatedData:
      type: object
      description: Payload of CapacityPlanCreated.
      required:
        - plan_id
        - warehouse_id
        - location
        - path_id
        - window_start
        - window_end
        - assigned_demand
        - path_capacity
        - capacity_over_window
        - shortage
        - bottleneck_step
        - status
      properties:
        plan_id:
          type: string
          description: The CapacityPlan id (UUID); equals the CloudEvents subject.
          example: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
        warehouse_id:
          type: string
          description: Warehouse the plan is for.
          example: "WH-1"
        location:
          type: string
          description: ProcessCapacity location the plan evaluates.
          example: "PATH-ZONE-A"
        path_id:
          type: string
          description: ProcessPath evaluated.
          example: "pick-rebin-pack"
        window_start:
          type: string
          format: date-time
          description: Planning window start (RFC 3339, UTC).
          example: "2026-10-05T08:00:00Z"
        window_end:
          type: string
          format: date-time
          description: Planning window end, exclusive (RFC 3339, UTC).
          example: "2026-10-05T16:00:00Z"
        assigned_demand:
          type: number
          format: double
          description: Orders assigned to the window.
          example: 12000
        path_capacity:
          type: number
          format: double
          description: Normalized path capacity, ORDER per HOUR.
          example: 1000
        capacity_over_window:
          type: number
          format: double
          description: path_capacity x window hours, in orders.
          example: 8000
        shortage:
          type: number
          format: double
          description: max(0, assigned_demand - capacity_over_window), in orders. Never negative.
          example: 4000
        bottleneck_step:
          type: string
          description: The ProcessPath step limiting end-to-end flow.
          example: "REBIN"
        status:
          type: string
          enum: [DRAFT]
          description: Always DRAFT at creation.
          example: DRAFT
