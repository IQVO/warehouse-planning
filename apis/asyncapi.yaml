    ShiftPlanCommittedData:
      type: object
      description: Fields this service reads from one fanned-out ShiftPlanCommitted message (one per PathPlan line).
      required: [path_id, planned_heads, planned_rate, planned_hours]
      properties:
        building_id:
          type: string
          example: "BLD1"
        shift_id:
          type: string
          example: "SHIFT1"
        path_id:
          type: string
          description: Becomes the ProcessType (upper-cased) of the LABOR constraint.
          example: "pack"
        planned_heads:
          type: integer
          example: 3
        planned_rate:
          type: number
          format: double
          example: 50
        planned_hours:
          type: number
          format: double
          example: 8
    LocationSlotRegisteredData:
      type: object
      description: Fields this service reads from LocationSlotRegistered.
      required: [locationCode, zoneId, locationType]
      properties:
        locationCode:
          type: string
          example: "A-01-01"
        zoneId:
          type: string
          example: "ZONE-A"
        locationType:
          type: string
          example: "BULK"
        role:
          type: string
          description: Storage (default) tallies storage positions per locationType; WorkCenter tallies stations per activity.
          example: "Storage"
        activities:
          type: array
          description: Present only when role is WorkCenter.
          items:
            type: string
    LocationSlotDecommissionedData:
      type: object
      description: Fields this service reads from LocationSlotDecommissioned.
      required: [locationCode]
      properties:
        locationCode:
          type: string
          example: "A-01-01"
    ShiftPlanCommittedEvent:
      description: CloudEvents 1.0 envelope of workforce-management's ShiftPlanCommitted (consumed).
